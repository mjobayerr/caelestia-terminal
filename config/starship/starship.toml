# Caelestia prompt for Starship.
# Palette matches theme/caelestia.psd1. Rounded pill segments echo the
# Material 3 shapes of the caelestia bar. Requires a Nerd Font.

"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](fg:m3primary)\
$os\
$directory\
$git_branch\
$git_status\
$python\
$nodejs\
$rust\
$golang\
$c\
[](fg:m3surfaceHigh)\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

add_newline = true
continuation_prompt = "[▸▸ ](fg:m3outline)"

[palettes.caelestia]
m3primary        = "#ffb0ca"
m3onPrimary      = "#541d34"
m3primaryCont    = "#6f334a"
m3onPrimaryCont  = "#ffd9e3"
m3secondary      = "#e2bdc7"
m3tertiary       = "#f0bc95"
m3onTertiary     = "#48290c"
m3error          = "#ffb4ab"
m3success        = "#B5CCBA"
m3surface        = "#191114"
m3surfaceLow     = "#22191c"
m3surfaceCont    = "#261d20"
m3surfaceHigh    = "#31282a"
m3onSurface      = "#efdfe2"
m3outline        = "#9e8c91"

palette = "caelestia"

[fill]
symbol = " "

[os]
disabled = false
style = "bg:m3primary fg:m3onPrimary"
format = "[ $symbol ]($style)"

[os.symbols]
Windows = ""
Arch = "󰣇"
Ubuntu = ""
Linux = ""

[directory]
style = "bg:m3primaryCont fg:m3onPrimaryCont"
format = "[](fg:m3primary bg:m3primaryCont)[ $path ]($style)[$read_only]($read_only_style)"
truncation_length = 3
truncation_symbol = "…/"
read_only = "󰌾 "
read_only_style = "bg:m3primaryCont fg:m3error"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music"     = "󰝚"
"Pictures"  = ""
"Dev"       = "󰲋"

[git_branch]
symbol = ""
style = "bg:m3surfaceHigh fg:m3tertiary"
format = "[](fg:m3primaryCont bg:m3surfaceHigh)[ $symbol $branch ]($style)"

[git_status]
style = "bg:m3surfaceHigh fg:m3error"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "󰞇 "
ahead = "⇡${count} "
behind = "⇣${count} "
diverged = "⇕⇡${ahead_count}⇣${behind_count} "
untracked = "? ${count} "
stashed = " "
modified = " ${count} "
staged = " ${count} "
renamed = "󰑕 ${count} "
deleted = " ${count} "

[python]
symbol = ""
style = "bg:m3surfaceHigh fg:m3secondary"
format = "[ $symbol $version( \\($virtualenv\\)) ]($style)"

[nodejs]
symbol = ""
style = "bg:m3surfaceHigh fg:m3success"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "bg:m3surfaceHigh fg:m3tertiary"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "bg:m3surfaceHigh fg:m3secondary"
format = "[ $symbol $version ]($style)"

[c]
symbol = ""
style = "bg:m3surfaceHigh fg:m3secondary"
format = "[ $symbol $version ]($style)"

[cmd_duration]
min_time = 1000
style = "fg:m3tertiary"
format = "[󱎫 $duration ]($style)"

[time]
disabled = false
time_format = "%H:%M"
style = "fg:m3outline"
format = "[󰥔 $time]($style)"

[character]
success_symbol = "[󰘧](bold fg:m3primary)"
error_symbol = "[󰘧](bold fg:m3error)"
vimcmd_symbol = "[󰘧](bold fg:m3success)"
